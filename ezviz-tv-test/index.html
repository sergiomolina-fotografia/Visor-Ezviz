<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>EZVIZ TV - webOS 6.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #0b0f19; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; user-select: none;
    }
    header {
      height: 65px; padding: 0 32px; background: #111827;
      border-bottom: 2px solid #1f2937; display: flex;
      align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { width: 38px; height: 38px; border-radius: 8px; }
    .brand h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; color: #38bdf8; }
    #status-bar { font-size: 17px; color: #94a3b8; font-family: monospace; }

    main { flex: 1; display: flex; padding: 16px 28px; gap: 20px; height: 1015px; }
    
    /* SECCIÓN IZQUIERDA: VIDEO + CONTROLES + BARRA INFERIOR DE REGISTROS */
    #player-section { flex: 0 0 1280px; display: flex; flex-direction: column; gap: 12px; }
    
    #video-container {
      width: 1280px; height: 690px; background: #000; border-radius: 12px;
      overflow: hidden; border: 2px solid #1f2937; position: relative;
    }
    #video-container video { width: 100%; height: 100%; object-fit: contain; }
    
    #controls { display: flex; gap: 10px; flex-wrap: wrap; }
    button.tv-btn {
      padding: 10px 18px; font-size: 18px; font-weight: 600; background: #1e293b;
      color: #e2e8f0; border: 3px solid #334155; border-radius: 8px; cursor: pointer;
      transition: all 0.15s ease;
    }
    button.tv-btn.focused, button.tv-btn:focus {
      background: #0284c7; border-color: #ffffff; color: #ffffff; outline: none; transform: scale(1.02);
    }
    button.tv-btn.active-cam {
      border-color: #38bdf8; background: #0f172a; color: #38bdf8;
    }

    /* BARRA INFERIOR: REGISTRO DEL SISTEMA DEBAJO DEL VIDEO PRINCIPAL */
    #log-card {
      width: 1280px; height: 175px; background: #111827; border: 2px solid #1f2937;
      border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column;
    }
    .log-card-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
    }
    .log-card-header .title {
      font-size: 16px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .log-card-header .shortcut-hint {
      font-size: 13px; color: #64748b; font-family: monospace;
    }
    #log-panel {
      flex: 1; background: #030712; border-radius: 6px; padding: 8px 12px;
      overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.45;
      white-space: pre-wrap; word-break: break-word; color: #cbd5e1;
      border: 1px solid #1f2937;
    }
    .log-info { color: #94a3b8; } .log-warn { color: #fbbf24; }
    .log-error { color: #f87171; } .log-ok { color: #4ade80; }

    /* SECCIÓN DERECHA: SIDEBAR COMPLETO PARA GRABACIONES CON MINIATURAS */
    #sidebar { flex: 1; display: flex; flex-direction: column; height: 935px; }
    #records-card {
      flex: 1; background: #111827; border: 2px solid #1f2937; border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-title {
      font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    
    .date-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .date-btn {
      flex: 1; padding: 10px 12px; font-size: 16px; font-weight: 600; background: #1e293b; color: #cbd5e1;
      border: 2px solid #334155; border-radius: 6px; cursor: pointer; text-align: center;
      transition: all 0.15s ease;
    }
    .date-btn.focused { background: #0284c7; color: #fff; border-color: #fff; transform: scale(1.02); }
    .date-btn.active-date { background: #0369a1; border-color: #38bdf8; color: #fff; }

    #records-list {
      flex: 1; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; align-content: start; padding-right: 6px;
    }
    
    /* TARJETAS CON MINIATURAS EN 2 COLUMNAS */
    .record-item {
      padding: 8px 10px; background: #151d2c; border: 2px solid #28354c; border-radius: 8px;
      color: #e2e8f0; cursor: pointer; display: flex; align-items: center; gap: 10px;
      transition: all 0.15s ease; min-width: 0;
    }
    .record-item.focused {
      background: #0284c7; border-color: #ffffff; color: #ffffff; transform: scale(1.03);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.5); outline: none; z-index: 5;
    }
    
    .record-thumb {
      flex: 0 0 76px; height: 50px; border-radius: 5px; overflow: hidden;
      background: linear-gradient(135deg, #1e293b, #0a0f1d); border: 1px solid #334155;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .record-thumb .play-icon {
      font-size: 18px; color: #38bdf8; opacity: 0.95;
    }
    .record-item.focused .record-thumb .play-icon {
      color: #ffffff; transform: scale(1.15);
    }
    .record-thumb .thumb-tag {
      position: absolute; top: 2px; left: 2px; font-size: 8px; font-weight: bold;
      background: #dc2626; color: #fff; padding: 1px 4px; border-radius: 2px;
    }

    .record-info {
      flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden;
    }
    .record-time-real {
      font-size: 18px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .record-sub-real {
      font-size: 12px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .record-item.focused .record-sub-real { color: #e0f2fe; }
    .record-item.focused .badge-utc-hint { color: #bae6fd; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon.png" alt="Logo" />
      <h1>EZVIZ TV</h1>
    </div>
    <div id="status-bar">Listo | RAM: -- MB</div>
  </header>
  <main>
    <!-- PANEL PRINCIPAL (IZQUIERDA): VIDEO + CONTROLES + BARRA DE REGISTROS -->
    <section id="player-section">
      <div id="video-container"></div>
      <div id="controls">
        <button class="tv-btn" id="btn-cam1" data-action="cam1">[1] Galería (H3c)</button>
        <button class="tv-btn" id="btn-cam2" data-action="cam2">[2] Living (C3TN)</button>
        <button class="tv-btn" id="btn-load-records" data-action="load-records">[4] Grabaciones</button>
        <button class="tv-btn" id="btn-stop" data-action="stop">[5] Detener</button>
        <button class="tv-btn" id="btn-clear" data-action="clear">[6] Limpiar</button>
      </div>
      <!-- BARRA INFERIOR DE REGISTROS DEBAJO DEL VIDEO -->
      <div id="log-card">
        <div class="log-card-header">
          <span class="title">📋 Registro del Sistema (Estado en tiempo real)</span>
          <span class="shortcut-hint">[CH+/-] Sig/Ant | [6] Limpiar | [5] Detener</span>
        </div>
        <div id="log-panel"></div>
      </div>
    </section>

    <!-- SIDEBAR DERECHO: 100% PARA GRABACIONES MICROSD CON MINIATURAS Y HORA REAL -->
    <aside id="sidebar">
      <div id="records-card">
        <div class="sidebar-title">
          <span>📼 Grabaciones microSD</span>
          <span id="records-cam-label" style="font-size: 16px; color: #38bdf8;">Galería</span>
        </div>
        <div class="date-row">
          <button class="date-btn active-date" id="btn-date-today" data-days="0">[7] Hoy</button>
          <button class="date-btn" id="btn-date-yesterday" data-days="1">[8] Ayer</button>
          <button class="date-btn" id="btn-date-prev" data-days="2">[9] Hace 2 días</button>
        </div>
        <div id="records-list">
          <div style="color: #64748b; text-align: center; margin-top: 50px; font-size: 18px;">
            Presioná [4] o seleccioná una fecha ([7], [8], [9]) para cargar clips
          </div>
        </div>
      </div>
    </aside>
  </main>
  <script src="config.local.js" onerror="void(0)"></script>
  <script src="app.js"></script>
</body>
</html>
